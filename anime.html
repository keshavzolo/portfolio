<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171817" />
    <meta name="description" content="A few anime favorites: Naruto, Haikyuu!!, and Bleach." />
    <title>Anime favorites — Keshav Maheshwari</title>
    <script src="./loading.js"></script>
    <link rel="stylesheet" href="./style.css" />
    <script>
      (() => {
        const savedTheme = localStorage.getItem("portfolio-theme");
        document.documentElement.classList.toggle("dark", savedTheme === null ? true : savedTheme === "dark");
      })();
    </script>
    <script src="./anime.js" defer></script>
  </head>
  <body>
    <div class="page-loader" role="status" aria-label="Loading portfolio">
      <div class="loader-card">
        <div class="loader-heading">
          <span class="loader-brand">KESHAV.DEV</span>
          <span class="loader-state">ENTERING ANIME ARC</span>
        </div>
        <p class="loader-command"><span aria-hidden="true">$</span> npm run anime-arc</p>
        <div class="loader-activity">
          <span class="loader-spinner" aria-hidden="true"></span>
          <span>Powering up your main-character arc<span class="loader-ellipsis" aria-hidden="true">...</span></span>
        </div>
        <div class="loader-track" aria-hidden="true"><span></span></div>
        <p class="loader-commit">git commit -m "one more episode"</p>
      </div>
    </div>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <nav class="top-nav wrap" aria-label="Main navigation">
        <div class="nav-links">
          <a href="./index.html#home">Home</a>
          <a href="./index.html#experience">Experience</a>
          <a href="./index.html#projects">Projects</a>
          <a class="anime-nav-link" href="./anime.html" aria-current="page">Anime</a>
          <a href="./index.html#about">About</a>
        </div>
        <div class="nav-tools">
          <button class="tool-button theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
            <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"></path>
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <main id="main" class="wrap anime-page">
      <section class="content-section" aria-labelledby="anime-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">A few favorites</p>
            <h1 id="anime-title">Anime</h1>
          </div>
        </div>
        <div class="anime-grid">
          <article class="anime-card anime-card-naruto">
            <img class="anime-poster" src="https://cdn.myanimelist.net/images/anime/13/17405.jpg" alt="Naruto" loading="lazy" />
            <h2 class="anime-title">Naruto</h2>
          </article>
          <article class="anime-card anime-card-haikyuu">
            <img class="anime-poster" src="https://cdn.myanimelist.net/images/anime/7/76014.jpg" alt="Haikyuu!!" loading="lazy" />
            <h2 class="anime-title">Haikyuu!!</h2>
          </article>
          <article class="anime-card anime-card-bleach">
            <img class="anime-poster" src="https://cdn.myanimelist.net/images/anime/3/40451.jpg" alt="Bleach" loading="lazy" />
            <h2 class="anime-title">Bleach</h2>
          </article>
          <article class="anime-card anime-card-attack-on-titan">
            <img class="anime-poster" src="https://cdn.myanimelist.net/images/anime/10/47347.jpg" alt="Attack on Titan" loading="lazy" />
            <h2 class="anime-title">Attack on Titan</h2>
          </article>
          <article class="anime-card anime-card-demon-slayer">
            <img class="anime-poster" src="https://cdn.myanimelist.net/images/anime/1286/99889.jpg" alt="Demon Slayer: Kimetsu no Yaiba" loading="lazy" />
            <h2 class="anime-title">Demon Slayer</h2>
          </article>
        </div>
      </section>
    </main>
  </body>
</html>
